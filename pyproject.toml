[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cw360"
version = "0.1.0"
description = "CodeWriter-Tutor TPU family foundation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "safetensors>=0.4",
    "huggingface_hub>=0.22",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
tpu = [
    "torch-xla",
]
providers = [
    "google-genai",
]
kaggle = [
    "kaggle",
]

[tool.setuptools.packages.find]
include = ["cw360*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
norecursedirs = ["_tmp_*", ".*tmp-*"]
